<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лента — Наш колледж</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="wrap">

    <div class="card">
      <div class="row">
        <span id="myAva"></span>
        <div>
          <h3 id="hello"></h3>
          <button class="ghost" onclick="toggleEdit()">Изменить аватарку</button>
        </div>
      </div>
      <div id="edit" class="hidden">
        <div id="emojis" class="picker"></div>
        <div id="colors" class="picker"></div>
        <button onclick="saveAvatar()">Сохранить</button>
      </div>
    </div>

    <div class="card">
      <h3>Новый пост</h3>
      <input id="pTitle" maxlength="80" placeholder="Заголовок">
      <textarea id="pText" rows="3" maxlength="500" placeholder="О чём хотите рассказать?"></textarea>
      <p id="pErr" class="err"></p>
      <button onclick="publish()">Опубликовать</button>
    </div>

    <div id="posts"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const me = requireLogin();
    renderBar("feed");
    let emoji = me.emoji, color = me.color;

    function drawMe() {
      const u = currentUser();
      document.getElementById("myAva").innerHTML = avatarHTML(u, true);
      document.getElementById("hello").textContent = "Привет, " + u.name + "!";
    }

    function toggleEdit() { document.getElementById("edit").classList.toggle("hidden"); drawPickers(); }

    function drawPickers() {
      document.getElementById("emojis").innerHTML = EMOJIS.map(e =>
        `<button class="${e === emoji ? "sel" : ""}" onclick="emoji='${e}';drawPickers()">${e}</button>`).join("");
      document.getElementById("colors").innerHTML = COLORS.map(c =>
        `<button class="swatch ${c === color ? "sel" : ""}" style="background:${c}" onclick="color='${c}';drawPickers()" aria-label="цвет"></button>`).join("");
    }

    function saveAvatar() {
      const users = getUsers();
      users[me.name].emoji = emoji;
      users[me.name].color = color;
      saveUsers(users);
      location.reload();
    }

    function drawPosts() {
      const likes = getLikes();
      const comments = getComments();
      document.getElementById("posts").innerHTML = getPosts().map(p => {
        const list = likes[p.id] || [];
        const liked = list.includes(me.name);
        const count = comments.filter(c => c.postId === p.id).length;
        return `
          <div class="card">
            <h2>${esc(p.title)}</h2>
            <p>${esc(p.text)}</p>
            ${p.author ? `<p class="meta">${esc(p.author)} · ${esc(p.time)}</p>` : ""}
            <div class="row">
              <button class="like ${liked ? "on" : ""}" onclick="like(${p.id})">${liked ? "❤️" : "🤍"} ${list.length}</button>
              <a href="comments.html?post=${p.id}">💬 Комментарии (${count})</a>
              ${p.author === me.name ? `<button class="ghost" onclick="delPost(${p.id})">Удалить</button>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function publish() {
      const title = document.getElementById("pTitle").value.trim();
      const text = document.getElementById("pText").value.trim();
      const err = document.getElementById("pErr");
      if (!title || !text) { err.textContent = "Заполните заголовок и текст."; return; }
      err.textContent = "";
      const list = getUserPosts();
      list.unshift({ id: Date.now(), title, text, author: me.name, time: new Date().toLocaleString("ru-RU") });
      saveUserPosts(list);
      document.getElementById("pTitle").value = "";
      document.getElementById("pText").value = "";
      drawPosts();
    }

    function delPost(id) {
      if (!confirm("Удалить пост?")) return;
      saveUserPosts(getUserPosts().filter(p => p.id !== id));
      saveComments(getComments().filter(c => c.postId !== id));
      drawPosts();
    }

    function like(id) { toggleLike(id, me.name); drawPosts(); }

    drawMe();
    drawPosts();
  </script>
</body>
</html>
